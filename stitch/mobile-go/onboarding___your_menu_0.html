<script>
        // Simple micro-interaction for adding items
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]');
                input.parentElement.style.transition = 'all 0.2s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
            });
        });

        // Add to list button simulation (visual only for UI demo)
        const addBtn = document.querySelector('button .material-symbols-outlined');
        if (addBtn) {
            addBtn.parentElement.addEventListener('click', () => {
                const btn = addBtn.parentElement;
                btn.classList.add('bg-tertiary-container');
                setTimeout(() => {
                    btn.classList.remove('bg-tertiary-container');
                }, 400);
            });
        }
    </script>
