<div class="absolute inset-0 noise-overlay pointer-events-none"></div>
<!-- Main Container -->
<main class="w-full max-w-4xl px-page_margin flex flex-col items-center justify-center z-10">
<!-- Top Section -->
<header class="flex flex-col items-center mb-section text-center">
<div class="flex items-center gap-related mb-related">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center shadow-lg shadow-primary-container/20">

</div>

<div class="mt-related flex items-center gap-1.5 px-3 py-1 bg-slate-900/50 rounded-full border border-slate-800">
<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
<span class="text-[10px] font-bold text-emerald-500 tracking-widest uppercase">Open</span>
</div>
</header>

<span class="font-display text-h1 text-emerald-400">AJ</span>
</div>

<span class="font-caption text-[10px] text-slate-500 uppercase tracking-tighter">Manager</span>
</button>

<div class="w-14 h-14 rounded-full bg-blue-500/20 flex items-center justify-center mb-1 border border-blue-500/30">

</div>
<span class="font-h2 text-h2 text-white group-hover:text-primary-fixed-dim transition-colors">Tom L.</span>
<span class="font-caption text-[10px] text-slate-500 uppercase tracking-tighter">Bartender</span>
</button>

<div class="w-14 h-14 rounded-full bg-purple-500/20 flex items-center justify-center mb-1 border border-purple-500/30">
<span class="font-display text-h1 text-purple-400">SR</span>
</div>
<span class="font-h2 text-h2 text-white group-hover:text-primary-fixed-dim transition-colors">Sarah R.</span>
<span class="font-caption text-[10px] text-slate-500 uppercase tracking-tighter">Cashier</span>
</button>
</div>
</section>
