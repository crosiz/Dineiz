<body class="bg-on-background font-body-md text-on-surface overflow-hidden">
<!-- Background Layer -->
<div class="fixed inset-0 blur-bg scale-110" data-alt="A blurred background of a high-end restaurant interior with sleek, modern point-of-sale terminals and elegant ambient lighting. The atmosphere is warm and inviting, suggesting a premium dining experience. Soft bokeh effects from the overhead lights create a sophisticated, professional aesthetic suitable for a corporate SaaS environment. The overall color palette is muted and professional."></div>
<div class="fixed inset-0 bg-black/85"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full h-screen flex items-center justify-center p-6">
<!-- Opening Card -->
<div class="bg-surface-container-lowest w-[520px] rounded-xxl custom-shadow overflow-hidden flex flex-col animate-in fade-in zoom-in duration-500">
<!-- Header: Gradient -->
<header class="bg-gradient-to-r from-[#FF5722] to-[#FF8A50] p-[28px] text-white text-center">
<div class="flex flex-col items-center gap-1">
<h1 class="font-headline-md text-[20px] font-bold tracking-tight">☀ Good Morning, Ali!</h1>
<p class="text-[14px] opacity-70 font-medium">Start your shift at Clifton Branch</p>
<div class="mt-4 py-2 px-6 bg-white/10 rounded-full inline-block backdrop-blur-sm">
<span class="text-[28px] font-bold tracking-widest" id="clock">09:00 AM</span>
</div>
</div>
</header>
<!-- Body Content -->
<div class="p-8 flex flex-col gap-6 max-h-[716px] overflow-y-auto">
<!-- Input Group -->
<div class="space-y-3">
<div class="flex flex-col">
<label class="text-[14px] font-semibold text-gray-700">Opening Cash Float</label>
<p class="text-[13px] text-text-muted">Count the cash in the drawer and enter the total</p>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-6 flex items-center pointer-events-none">
<span class="text-on-surface-variant font-bold text-xl">PKR</span>
</div>
<input class="w-full h-[72px] text-center text-[32px] font-bold text-primary border-2 border-border-subtle rounded-xl focus:ring-4 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="totalCashInput" placeholder="0" type="number" value="5000"/>
</div>
</div>
<!-- Collapsible Denominations -->
<div class="border border-border-subtle rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between px-4 py-3 bg-surface-container-low hover:bg-surface-container transition-colors group" onclick="toggleDenominations()">
<span class="text-label-md font-semibold text-on-surface-variant">Enter by denomination</span>
<span class="material-symbols-outlined transition-transform duration-300" id="chevron-icon">expand_more</span>
</button>
<div class="hidden animate-in slide-in-from-top-2 duration-300" id="denom-section">
<div class="p-4 space-y-3 bg-white">
<!-- Denom Grid Header -->
<div class="grid grid-cols-3 text-[11px] font-bold text-text-muted uppercase tracking-wider px-2">
<span>Note</span>
<span class="text-center">Qty</span>
<span class="text-right">Total</span>
</div>
<!-- Rows -->
<div class="space-y-2" id="denom-rows">
<!-- JS will populate or keep static if needed -->
<div class="grid grid-cols-3 items-center gap-4 p-2 bg-surface-container-lowest border border-transparent hover:border-border-subtle rounded-lg transition-all group">
<span class="text-label-md font-bold text-on-surface">5000</span>
<input class="denom-qty w-full h-8 text-center bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary text-sm" data-val="5000" oninput="calculate()" type="number" value="1"/>
<span class="row-total text-right text-label-md font-semibold text-primary">5000</span>
</div>
<div class="grid grid-cols-3 items-center gap-4 p-2 bg-surface-container-lowest border border-transparent hover:border-border-subtle rounded-lg transition-all">
<span class="text-label-md font-bold text-on-surface">1000</span>
<input class="denom-qty w-full h-8 text-center bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary text-sm" data-val="1000" oninput="calculate()" type="number" value="0"/>
<span class="row-total text-right text-label-md font-semibold text-primary">0</span>
</div>
<div class="grid grid-cols-3 items-center gap-4 p-2 bg-surface-container-lowest border border-transparent hover:border-border-subtle rounded-lg transition-all">
<span class="text-label-md font-bold text-on-surface">500</span>
<input class="denom-qty w-full h-8 text-center bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary text-sm" data-val="500" oninput="calculate()" type="number" value="0"/>
<span class="row-total text-right text-label-md font-semibold text-primary">0</span>
</div>
<div class="grid grid-cols-3 items-center gap-4 p-2 bg-surface-container-lowest border border-transparent hover:border-border-subtle rounded-lg transition-all">
<span class="text-label-md font-bold text-on-surface">100</span>
<input class="denom-qty w-full h-8 text-center bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary text-sm" data-val="100" oninput="calculate()" type="number" value="0"/>
<span class="row-total text-right text-label-md font-semibold text-primary">0</span>
</div>
<div class="grid grid-cols-3 items-center gap-4 p-2 bg-surface-container-lowest border border-transparent hover:border-border-subtle rounded-lg transition-all">
<span class="text-label-md font-bold text-on-surface">50</span>
<input class="denom-qty w-full h-8 text-center bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary text-sm" data-val="50" oninput="calculate()" type="number" value="0"/>
<span class="row-total text-right text-label-md font-semibold text-primary">0</span>
</div>
<div class="grid grid-cols-3 items-center gap-4 p-2 bg-surface-container-lowest border border-transparent hover:border-border-subtle rounded-lg transition-all">
<span class="text-label-md font-bold text-on-surface">20</span>
<input class="denom-qty w-full h-8 text-center bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary text-sm" data-val="20" oninput="calculate()" type="number" value="0"/>
<span class="row-total text-right text-label-md font-semibold text-primary">0</span>
</div>
<div class="grid grid-cols-3 items-center gap-4 p-2 bg-surface-container-lowest border border-transparent hover:border-border-subtle rounded-lg transition-all">
<span class="text-label-md font-bold text-on-surface">10</span>
<input class="denom-qty w-full h-8 text-center bg-surface-container-low border-none rounded-md focus:ring-2 focus:ring-primary text-sm" data-val="10" oninput="calculate()" type="number" value="0"/>
<span class="row-total text-right text-label-md font-semibold text-primary">0</span>
</div>
</div>
</div>
</div>
</div>
<!-- Dropdown -->
<div class="relative group">
<label class="text-[11px] font-bold text-text-muted uppercase tracking-wider mb-1 block">Selected Terminal</label>
<div class="relative">
<select class="w-full h-12 pl-4 pr-10 bg-white border border-border-subtle rounded-xl text-on-surface font-medium appearance-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all">
<option>Terminal: Counter 1</option>
<option>Terminal: Counter 2</option>
<option>Terminal: Takeaway Window</option>
<option>Terminal: Drive-thru</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">unfold_more</span>
</div>
</div>
</div>
<!-- Footer: CTA -->
<footer class="p-8 pt-0">
<button class="w-full h-[52px] bg-primary-container hover:bg-primary text-white font-bold text-lg rounded-xl shadow-lg shadow-primary-container/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                    Start Shift
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</footer>
</div>
</main>
<script>
        function toggleDenominations() {
            const section = document.getElementById('denom-section');
            const icon = document.getElementById('chevron-icon');
            section.classList.toggle('hidden');
            if (section.classList.contains('hidden')) {
                icon.style.transform = 'rotate(0deg)';
            } else {
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function calculate() {
            const rows = document.querySelectorAll('.denom-qty');
            let grandTotal = 0;
            
            rows.forEach(input => {
                const multiplier = parseInt(input.getAttribute('data-val'));
                const qty = parseInt(input.value) || 0;
                const total = multiplier * qty;
                
                // Update row total display
                const totalSpan = input.closest('div').querySelector('.row-total');
                totalSpan.textContent = total;
                
                grandTotal += total;
            });

            // Update main input
            document.getElementById('totalCashInput').value = grandTotal;
        }

        // Live Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0'+minutes : minutes;
            const strTime = (hours < 10 ? '0'+hours : hours) + ':' + minutes + ' ' + ampm;
            document.getElementById('clock').textContent = strTime;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Atmospheric micro-interaction
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.custom-shadow');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
