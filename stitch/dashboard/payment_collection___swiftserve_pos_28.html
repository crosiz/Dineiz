<!-- Micro-interaction Script -->
<script>
        // Simple numpad interaction logic
        const input = document.getElementById('amount-input');
        const numButtons = document.querySelectorAll('.numpad-btn');

        numButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.innerText;
                const icon = btn.querySelector('.material-symbols-outlined');
                
                if (icon && icon.innerText === 'backspace') {
                    input.value = input.value.slice(0, -1);
                } else if (val && val !== '.') {
                    // Simple append for demo
                    if (input.value === '0') input.value = val;
                    else input.value += val;
                } else if (val === '.' && !input.value.includes('.')) {
                    input.value += '.';
                }
            });
        });

        // Toggle focus state via JS to simulate touch experience
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('ring-4', 'ring-primary-container/10');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('ring-4', 'ring-primary-container/10');
        });
    </script>
