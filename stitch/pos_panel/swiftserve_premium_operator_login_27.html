<script>
        let pin = "";
        const maxPinLength = 4;
        const roleStep = document.getElementById('role-step');
        const pinStep = document.getElementById('pin-step');
        const roleTitle = document.getElementById('active-role-title');
        const dots = document.querySelectorAll('.pin-dot');
        const confirmBtn = document.getElementById('confirm-btn');

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function selectRole(role, icon) {
            roleStep.classList.add('hidden');
            pinStep.classList.remove('hidden');
            roleTitle.textContent = `${role} Access`;
            clearPin();
        }

        function goBack() {
            pinStep.classList.add('hidden');
            roleStep.classList.remove('hidden');
            clearPin();
        }

        function addPin(num) {
            if (pin.length < maxPinLength) {
                pin += num;
                updateDots();
            }
        }

        function clearPin() {
            pin = "";
            updateDots();
        }

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < pin.length) {
                    dot.classList.add('bg-primary', 'border-primary');
                    dot.classList.remove('border-outline-variant');
                } else {
                    dot.classList.remove('bg-primary', 'border-primary');
                    dot.classList.add('border-outline-variant');
                }
            });

            if (pin.length === maxPinLength) {
                confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-[#1E1E1E]');
                confirmBtn.classList.add('bg-primary/10', 'border-primary', 'hover:bg-primary/20');
            } else {
                confirmBtn.classList.add('opacity-50', 'cursor-not-allowed', 'bg-[#1E1E1E]');
                confirmBtn.classList.remove('bg-primary/10', 'border-primary', 'hover:bg-primary/20');
            }
        }

        function validatePin() {
            if (pin.length === maxPinLength) {
                // Success feedback
                const container = document.body;
                container.style.transition = 'opacity 500ms ease-out';
                container.style.opacity = '0';
                setTimeout(() => {
                    alert('Authenticated. Loading Workspace...');
                    window.location.reload();
                }, 500);
            }
        }

        // Add keyboard support
        document.addEventListener('keydown', (e) => {
            if (pinStep.classList.contains('hidden')) return;
            
            if (e.key >= '0' && e.key <= '9') {
                addPin(e.key);
            } else if (e.key === 'Backspace') {
                clearPin();
            } else if (e.key === 'Enter') {
                validatePin();
            } else if (e.key === 'Escape') {
                goBack();
            }
        });
    </script>
