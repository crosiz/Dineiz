<div>

</div>

<!-- Main Content Area (Scrollable) -->
<main class="flex-1 overflow-y-auto custom-scrollbar px-margin-desktop py-lg space-y-xl">
<!-- 1. Quantity Stepper -->

<h3 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-widest mb-md">Set Quantity</h3>
<div class="flex items-center gap-md bg-surface-container-low p-sm rounded-xl w-fit border border-outline-variant">
<button class="w-[64px] h-[64px] flex items-center justify-center rounded-lg bg-surface-variant text-alert-red active:scale-95 transition-transform border border-outline-variant">
<span class="material-symbols-outlined text-[32px]">remove</span>
</button>
<div class="w-[80px] text-center">
<span class="font-display-lg text-display-lg text-on-surface">1</span>
</div>
<button class="w-[64px] h-[64px] flex items-center justify-center rounded-lg bg-surface-variant text-success-green active:scale-95 transition-transform border border-outline-variant">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
</section>
<!-- 2. Choose Size (Single Select) -->
<section>
<div class="flex items-center justify-between mb-md">
<h3 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-widest">Choose Size</h3>
<span class="bg-primary-container/10 text-primary-container font-label-md text-label-md px-sm py-1 rounded">REQUIRED</span>
</div>
<div class="grid grid-cols-2 gap-md">
<label class="relative flex items-center justify-between h-[72px] px-lg rounded-xl border-2 border-amber-accent bg-surface-container-high cursor-pointer">
<input checked="" class="hidden" name="size" type="radio"/>
<span class="font-headline-sm text-headline-sm text-on-surface">Regular</span>
<span class="material-symbols-outlined text-amber-accent" style="font-variation-settings: 'FILL' 1;">radio_button_checked</span>
</label>
<label class="relative flex items-center justify-between h-[72px] px-lg rounded-xl border border-outline-variant bg-surface-container hover:bg-surface-container-low cursor-pointer transition-colors">
<input class="hidden" name="size" type="radio"/>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">Large</span>
<span class="font-label-md text-label-md text-primary-container">+ PKR 200</span>
</div>

</div>

<label class="flex items-center justify-between h-[64px] px-lg rounded-xl border border-outline-variant bg-surface-container hover:bg-surface-container-low cursor-pointer transition-colors">

</div>
<span class="font-label-lg text-label-lg text-primary-container">+ PKR 150</span>
</label>

<div class="flex items-center gap-md">

</div>

                        No onions
                    </span>
</div>

<!-- Micro-interactions Script -->
<script>
        // Simple click interaction for ingredient toggles
        document.querySelectorAll('button[class*="rounded-full"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const isRemoved = this.classList.contains('border-alert-red');
                const icon = this.querySelector('.material-symbols-outlined');
                const label = this.querySelector('span:not(.material-symbols-outlined)');
                
                if (isRemoved) {
                    this.classList.remove('border-alert-red', 'bg-alert-red/10', 'text-alert-red');
                    this.classList.add('border-outline-variant', 'bg-surface-container', 'text-on-surface');
                    icon.textContent = 'check_circle';
                    label.classList.remove('line-through');
                } else {
                    this.classList.add('border-alert-red', 'bg-alert-red/10', 'text-alert-red');
                    this.classList.remove('border-outline-variant', 'bg-surface-container', 'text-on-surface');
                    icon.textContent = 'block';
                    label.classList.add('line-through');
                }
            });
        });

        // Simple radio selection visual update
        const radios = document.querySelectorAll('input[name="size"]');
        radios.forEach(radio => {
            radio.addEventListener('change', function() {
                radios.forEach(r => {
                    const parent = r.closest('label');
                    const icon = parent.querySelector('.material-symbols-outlined');
                    if (r.checked) {
                        parent.classList.add('border-amber-accent', 'bg-surface-container-high');
                        parent.classList.remove('border-outline-variant', 'bg-surface-container');
                        icon.textContent = 'radio_button_checked';
                        icon.style.fontVariationSettings = "'FILL' 1";
                        icon.classList.add('text-amber-accent');
                    } else {
                        parent.classList.remove('border-amber-accent', 'bg-surface-container-high');
                        parent.classList.add('border-outline-variant', 'bg-surface-container');
                        icon.textContent = 'radio_button_unchecked';
                        icon.style.fontVariationSettings = "'FILL' 0";
                        icon.classList.remove('text-amber-accent');
                    }
                });
            });
        });
    </script>
