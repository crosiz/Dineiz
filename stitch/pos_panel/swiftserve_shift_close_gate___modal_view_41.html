<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SwiftServe POS - Shift Closing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#ffddb8",
                      "tertiary": "#cdccca",
                      "on-tertiary": "#2f312f",
                      "secondary-fixed-dim": "#c9c6c5",
                      "background": "#0A0A0F",
                      "outline": "#a08e7a",
                      "primary-fixed-dim": "#ffb95f",
                      "on-tertiary-container": "#434442",
                      "error": "#ffb4ab",
                      "surface-bright": "#41382e",
                      "on-primary-fixed-variant": "#653e00",
                      "on-surface-variant": "#d8c3ad",
                      "secondary-container": "#4a4949",
                      "on-tertiary-fixed-variant": "#464745",
                      "surface-container-lowest": "#140d06",
                      "on-primary-fixed": "#2a1700",
                      "inverse-surface": "#f0e0d1",
                      "error-container": "#93000a",
                      "surface-tint": "#ffb95f",
                      "on-primary": "#472a00",
                      "tertiary-fixed": "#e3e2e0",
                      "inverse-primary": "#855300",
                      "outline-variant": "#534434",
                      "on-secondary-fixed-variant": "#474646",
                      "surface-container-high": "#31281f",
                      "inverse-on-surface": "#382f25",
                      "secondary-fixed": "#e5e2e1",
                      "on-primary-container": "#613b00",
                      "on-background": "#f0e0d1",
                      "primary-container": "#f59e0b",
                      "surface-dim": "#19120a",
                      "surface": "#19120a",
                      "tertiary-fixed-dim": "#c7c6c4",
                      "on-error": "#690005",
                      "tertiary-container": "#b1b1ae",
                      "on-surface": "#f0e0d1",
                      "primary": "#ffc174",
                      "surface-container-highest": "#3c3329",
                      "secondary": "#c9c6c5",
                      "on-secondary-fixed": "#1c1b1b",
                      "on-tertiary-fixed": "#1a1c1a",
                      "on-secondary": "#313030",
                      "surface-container": "#261e15",
                      "on-secondary-container": "#bab8b7",
                      "on-error-container": "#ffdad6",
                      "surface-container-low": "#221a12",
                      "surface-variant": "#3c3329"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "margin-desktop": "32px",
                      "lg": "24px",
                      "base": "8px",
                      "sm": "8px",
                      "xl": "32px",
                      "gutter": "16px",
                      "xs": "4px",
                      "md": "16px"
              },
              "fontFamily": {
                      "label-md": ["Inter"],
                      "headline-sm": ["Clash Display"],
                      "currency-display": ["Clash Display"],
                      "headline-md": ["Clash Display"],
                      "body-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "display-lg": ["Clash Display"],

              },
              "fontSize": {
                      "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "currency-display": ["36px", {"lineHeight": "44px", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-lg": ["14px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0F; }
        .font-clash { font-family: 'Clash Display', sans-serif; }
        .modal-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        input:focus { outline: 2px solid #ff9d00; outline-offset: 2px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-md">
<!-- SHIFT CLOSING MODAL -->
<div class="w-full max-w-[520px] bg-white rounded-[20px] overflow-hidden modal-shadow flex flex-col">
<!-- CARD HEADER -->
<div class="bg-gradient-to-r from-[#1A1A2E] to-[#0F172A] p-lg flex items-center gap-md">
<div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-white">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<div>
<h1 class="text-[20px] font-bold text-white leading-tight">End of Shift</h1>
<p class="text-[14px] text-gray-400">Gulshan-e-Iqbal Branch</p>
</div>
</div>
<!-- MODAL CONTENT -->
<div class="p-lg flex flex-col">
<!-- SUMMARY STRIP -->
<div class="bg-[#F8FAFC] border border-slate-200 rounded-[10px] p-md mb-lg flex justify-between items-center divide-x divide-slate-200">
<div class="flex-1 text-center px-2">
<span class="block text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Duration</span>
<span class="block text-[16px] font-bold text-slate-900">8h 12m</span>
</div>
<div class="flex-1 text-center px-2">
<span class="block text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Orders</span>
<span class="block text-[16px] font-bold text-slate-900">47</span>
</div>
<div class="flex-1 text-center px-2">
<span class="block text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Total Sales</span>
<span class="block text-[16px] font-bold text-slate-900">PKR 52,400</span>
</div>
</div>
<!-- CASH RECONCILIATION -->
<div class="space-y-md">
<!-- ROW 1: EXPECTED -->
<div>
<label class="block text-[14px] font-semibold text-slate-700 mb-1">Expected in drawer</label>
<div class="flex justify-between items-end">
<span class="text-[24px] font-clash font-bold text-slate-900" id="expected-val">PKR 28,650</span>
<span class="text-[11px] text-slate-400 pb-1 italic">(Opening Float PKR 5,000 + Cash Orders PKR 23,650)</span>
</div>
</div>
<!-- ROW 2: ACTUAL -->
<div class="pt-2">
<label class="block text-[14px] font-semibold text-slate-700 mb-2">Actual cash (count now)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-[18px] font-bold text-slate-400">PKR</span>
<input class="w-full h-16 bg-[#F8FAFC] border border-slate-200 rounded-[12px] pl-16 pr-4 text-[24px] font-clash font-bold text-slate-900 focus:ring-0 focus:border-slate-300 transition-all" id="actual-cash" oninput="calculateVariance()" placeholder="0.00" type="number"/>
</div>
</div>
<!-- ROW 3: VARIANCE -->
<div class="hidden opacity-0 transform translate-y-2 transition-all duration-300" id="variance-container">
<div class="flex justify-between items-center py-2 px-4 rounded-lg bg-opacity-10" id="variance-bg">
<span class="text-[14px] font-semibold text-slate-600">Variance</span>
<span class="text-[18px] font-bold" id="variance-text"></span>
</div>
</div>
<!-- NOTES -->
<div class="pt-2">
<label class="block text-[14px] font-semibold text-slate-700 mb-2">Add notes for any discrepancy</label>
<textarea class="w-full bg-[#F8FAFC] border border-slate-200 rounded-[12px] p-md text-slate-900 text-[14px] placeholder-slate-400 focus:ring-0 focus:border-slate-300 resize-none" placeholder="Enter reason for variance..." rows="3"></textarea>
</div>
</div>
<!-- ACTION BUTTONS -->
<div class="mt-xl flex gap-md">
<button class="flex-1 h-[52px] border-2 border-slate-200 rounded-xl text-slate-600 font-bold hover:bg-slate-50 transition-colors active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
                    Back
                </button>
<button class="flex-[2] h-[52px] bg-primary-container text-on-primary-container rounded-xl font-bold hover:brightness-105 transition-all active:scale-95 shadow-lg shadow-primary-container/20">
                    Close Shift &amp; Submit
                </button>
</div>
</div>
</div>
<!-- LOGO ANCHOR (OFF-SCREEN OR SUBTLE) -->
<div class="fixed bottom-8 opacity-20 pointer-events-none">
<h2 class="font-clash text-white text-headline-sm uppercase tracking-widest">SwiftServe POS</h2>
</div>
<script>
        function calculateVariance() {
            const expected = 28650;
            const actualInput = document.getElementById('actual-cash');
            const varianceContainer = document.getElementById('variance-container');
            const varianceText = document.getElementById('variance-text');
            const varianceBg = document.getElementById('variance-bg');
            
            const actualValue = parseFloat(actualInput.value);
            
            if (isNaN(actualValue)) {
                varianceContainer.classList.add('hidden');
                varianceContainer.classList.remove('opacity-100', 'translate-y-0');
                return;
            }

            varianceContainer.classList.remove('hidden');
            setTimeout(() => {
                varianceContainer.classList.add('opacity-100', 'translate-y-0');
            }, 10);

            const variance = actualValue - expected;

            if (variance === 0) {
                varianceText.innerText = "BALANCED";
                varianceText.className = "text-[18px] font-bold text-slate-600";
                varianceBg.className = "flex justify-between items-center py-2 px-4 rounded-lg bg-slate-100";
            } else if (variance > 0) {
                varianceText.innerText = `+PKR ${Math.abs(variance).toLocaleString()} OVER`;
                varianceText.className = "text-[18px] font-bold text-emerald-600";
                varianceBg.className = "flex justify-between items-center py-2 px-4 rounded-lg bg-emerald-50";
            } else {
                varianceText.innerText = `-PKR ${Math.abs(variance).toLocaleString()} SHORT`;
                varianceText.className = "text-[18px] font-bold text-rose-600";
                varianceBg.className = "flex justify-between items-center py-2 px-4 rounded-lg bg-rose-50";
            }
        }
    </script>
</body></html>
