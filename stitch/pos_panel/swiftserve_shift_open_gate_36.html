<body class="bg-[#0A0A0F] min-h-screen flex items-center justify-center font-body-md overflow-hidden antialiased">

<div class="text-[40px] font-bold tracking-tight mb-1 font-display-lg">

</header>

<div class="absolute inset-0 z-0 pointer-events-none opacity-20">

<!-- Micro-Interactions -->
<script>
        // Set Float Value
        function setFloat(val) {
            const input = document.getElementById('floatInput');
            input.value = val;
            
            // Subtle flash effect on set
            input.parentElement.classList.add('ring-2', 'ring-primary-container');
            setTimeout(() => {
                input.parentElement.classList.remove('ring-2', 'ring-primary-container');
            }, 300);
        }

        // Toggle Denominations
        const toggleBtn = document.getElementById('toggleDenominations');
        const grid = document.getElementById('denominationGrid');
        
        toggleBtn.addEventListener('click', () => {
            grid.classList.toggle('hidden');
            const icon = toggleBtn.querySelector('.material-symbols-outlined');
            if (grid.classList.contains('hidden')) {
                icon.innerText = 'expand_more';
            } else {
                icon.innerText = 'expand_less';
                // Focus first input
                grid.querySelector('input').focus();
            }
        });

        // Current Time Update (Optional polish)
        function updateTime() {
            const timeDisplay = document.querySelector('.font-display-lg');
            const dateDisplay = document.querySelector('.text-white\\/65');
            const now = new Date();
            
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            
            if (timeDisplay) timeDisplay.innerText = timeStr;
            if (dateDisplay) dateDisplay.innerText = dateStr;
        }
        
        // Initial set and interval
        updateTime();
        setInterval(updateTime, 1000 * 30); // Refresh every 30s
    </script>
</body></html>
