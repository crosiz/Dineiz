<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SwiftServe POS - Shift Opening</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<!-- Clash Display is a custom font, using Inter/Oswald as fallback if not loaded, but styling for defined tokens -->
<link href="https://fonts.cdnfonts.com/css/clash-display" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#ffddb8",
                    "tertiary": "#cdccca",
                    "on-tertiary": "#2f312f",
                    "secondary-fixed-dim": "#c9c6c5",
                    "background": "#19120a",
                    "outline": "#a08e7a",
                    "primary-fixed-dim": "#ffb95f",
                    "on-tertiary-container": "#434442",
                    "error": "#ffb4ab",
                    "surface-bright": "#41382e",
                    "on-primary-fixed-variant": "#653e00",
                    "on-surface-variant": "#d8c3ad",
                    "secondary-container": "#4a4949",
                    "on-tertiary-fixed-variant": "#464745",
                    "surface-container-lowest": "#140d06",
                    "on-primary-fixed": "#2a1700",
                    "inverse-surface": "#f0e0d1",
                    "error-container": "#93000a",
                    "surface-tint": "#ffb95f",
                    "on-primary": "#472a00",
                    "tertiary-fixed": "#e3e2e0",
                    "inverse-primary": "#855300",
                    "outline-variant": "#534434",
                    "surface-container-high": "#31281f",
                    "inverse-on-surface": "#382f25",
                    "secondary-fixed": "#e5e2e1",
                    "on-primary-container": "#613b00",
                    "on-background": "#f0e0d1",
                    "primary-container": "#f59e0b",
                    "surface-dim": "#19120a",
                    "surface": "#19120a",
                    "tertiary-fixed-dim": "#c7c6c4",
                    "on-error": "#690005",
                    "tertiary-container": "#b1b1ae",
                    "on-surface": "#f0e0d1",
                    "primary": "#ffc174",
                    "surface-container-highest": "#3c3329",
                    "secondary": "#c9c6c5",
                    "on-secondary-fixed": "#1c1b1b",
                    "on-tertiary-fixed": "#1a1c1a",
                    "on-secondary": "#313030",
                    "surface-container": "#261e15",
                    "on-secondary-container": "#bab8b7",
                    "on-error-container": "#ffdad6",
                    "surface-container-low": "#221a12",
                    "surface-variant": "#3c3329"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "lg": "24px",
                    "base": "8px",
                    "sm": "8px",
                    "xl": "32px",
                    "gutter": "16px",
                    "xs": "4px",
                    "md": "16px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "headline-sm": ["Clash Display", "sans-serif"],
                    "currency-display": ["Clash Display", "sans-serif"],
                    "headline-md": ["Clash Display", "sans-serif"],
                    "body-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Clash Display", "sans-serif"],
                    "body-md": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-lg": ["Clash Display", "sans-serif"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "currency-display": ["36px", {"lineHeight": "44px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0F; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .modal-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .blinking-cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { border-color: transparent; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 overflow-hidden">
<!-- Shift Opening Modal -->
<div class="w-full max-w-[520px] bg-white rounded-[20px] modal-shadow overflow-hidden flex flex-col">
<!-- CARD HEADER -->
<header class="bg-gradient-to-r from-[#FF5722] to-[#FF8A50] p-6 text-white text-center">
<div class="flex flex-col items-center gap-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">light_mode</span>
<h1 class="font-headline-sm text-headline-sm leading-none font-bold">Start Your Shift</h1>
</div>
<p class="font-body-sm text-body-sm opacity-70">Gulshan-e-Iqbal Branch</p>
<div class="mt-4">
<span class="font-display-lg text-[32px] font-bold tracking-tight" id="currentTime">09:00 AM</span>
</div>
</div>
</header>
<!-- CARD BODY -->
<main class="bg-white p-[28px] space-y-6">
<!-- Staff Info Row -->
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-[#FF5722] flex items-center justify-center text-white font-bold text-lg">
                    AB
                </div>
<div class="flex flex-col">
<span class="font-headline-sm text-on-secondary-fixed text-[16px] font-bold">Amna Butt</span>
<span class="font-body-sm text-on-surface-variant text-[13px]">Cashier</span>
</div>
<div class="ml-auto flex items-center gap-1 text-green-600 font-label-md">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span>Verified</span>
</div>
</div>
<hr class="border-outline-variant opacity-20"/>
<!-- Opening Cash Float Section -->
<div class="space-y-4">
<div class="space-y-1">
<label class="font-headline-sm text-on-secondary-fixed text-[16px] font-bold block">Opening Cash Float</label>
<p class="font-body-sm text-on-surface-variant text-[13px]">Count the cash in your drawer and enter the total amount</p>
</div>
<!-- Large PKR Input -->
<div class="relative flex items-center h-[72px] bg-[#F8FAFC] border-2 border-[#E2E8F0] rounded-[12px] group focus-within:border-primary-container transition-all">
<div class="pl-5 pr-3 text-on-surface-variant font-headline-md text-[18px] font-bold border-r border-outline-variant mr-4">
                        PKR
                    </div>
<input class="w-full bg-transparent border-none focus:ring-0 text-[32px] font-bold font-currency-display text-on-secondary-fixed placeholder:text-[#E2E8F0]" id="totalFloat" oninput="updateDenominationsFromTotal()" placeholder="0.00" type="number"/>
<div class="absolute right-4 w-[2px] h-[32px] bg-primary-container blinking-cursor opacity-0 group-focus-within:opacity-100"></div>
</div>
<!-- Quick Float Buttons -->
<div class="flex gap-2">
<button class="flex-1 py-3 px-2 bg-surface-container-low hover:bg-primary-container hover:text-on-primary-container transition-colors rounded-lg font-label-lg text-on-surface-variant border border-outline-variant/30" onclick="setFloat(2000)">
                        PKR 2,000
                    </button>
<button class="flex-1 py-3 px-2 bg-surface-container-low hover:bg-primary-container hover:text-on-primary-container transition-colors rounded-lg font-label-lg text-on-surface-variant border border-outline-variant/30" onclick="setFloat(5000)">
                        PKR 5,000
                    </button>
<button class="flex-1 py-3 px-2 bg-surface-container-low hover:bg-primary-container hover:text-on-primary-container transition-colors rounded-lg font-label-lg text-on-surface-variant border border-outline-variant/30" onclick="setFloat(10000)">
                        PKR 10,000
                    </button>
</div>
</div>
<!-- Denomination Breakdown -->
<div class="border border-outline-variant rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-4 bg-surface-container-low hover:bg-surface-container transition-colors" onclick="toggleDenominations()">
<span class="font-label-lg text-on-surface-variant">Count by denomination</span>
<span class="material-symbols-outlined transition-transform" id="chevron">expand_more</span>
</button>
<div class="hidden border-t border-outline-variant p-4 space-y-4" id="denomContainer">
<div class="grid grid-cols-2 gap-x-6 gap-y-3">
<!-- 5000 -->
<div class="flex items-center justify-between">
<span class="font-body-sm text-on-surface-variant w-12">5000</span>
<div class="flex items-center gap-2">
<span class="text-xs opacity-40">×</span>
<input class="denom-input w-14 h-8 bg-[#F8FAFC] border border-[#E2E8F0] rounded text-center text-sm font-bold" data-val="5000" oninput="calculateTotal()" type="number" value="0"/>
</div>
</div>
<!-- 1000 -->
<div class="flex items-center justify-between">
<span class="font-body-sm text-on-surface-variant w-12">1000</span>
<div class="flex items-center gap-2">
<span class="text-xs opacity-40">×</span>
<input class="denom-input w-14 h-8 bg-[#F8FAFC] border border-[#E2E8F0] rounded text-center text-sm font-bold" data-val="1000" oninput="calculateTotal()" type="number" value="0"/>
</div>
</div>
<!-- 500 -->
<div class="flex items-center justify-between">
<span class="font-body-sm text-on-surface-variant w-12">500</span>
<div class="flex items-center gap-2">
<span class="text-xs opacity-40">×</span>
<input class="denom-input w-14 h-8 bg-[#F8FAFC] border border-[#E2E8F0] rounded text-center text-sm font-bold" data-val="500" oninput="calculateTotal()" type="number" value="0"/>
</div>
</div>
<!-- 100 -->
<div class="flex items-center justify-between">
<span class="font-body-sm text-on-surface-variant w-12">100</span>
<div class="flex items-center gap-2">
<span class="text-xs opacity-40">×</span>
<input class="denom-input w-14 h-8 bg-[#F8FAFC] border border-[#E2E8F0] rounded text-center text-sm font-bold" data-val="100" oninput="calculateTotal()" type="number" value="0"/>
</div>
</div>
<!-- 50 -->
<div class="flex items-center justify-between">
<span class="font-body-sm text-on-surface-variant w-12">50</span>
<div class="flex items-center gap-2">
<span class="text-xs opacity-40">×</span>
<input class="denom-input w-14 h-8 bg-[#F8FAFC] border border-[#E2E8F0] rounded text-center text-sm font-bold" data-val="50" oninput="calculateTotal()" type="number" value="0"/>
</div>
</div>
<!-- 20 -->
<div class="flex items-center justify-between">
<span class="font-body-sm text-on-surface-variant w-12">20</span>
<div class="flex items-center gap-2">
<span class="text-xs opacity-40">×</span>
<input class="denom-input w-14 h-8 bg-[#F8FAFC] border border-[#E2E8F0] rounded text-center text-sm font-bold" data-val="20" oninput="calculateTotal()" type="number" value="0"/>
</div>
</div>
</div>
<div class="bg-surface-container-low p-3 rounded-lg flex items-center justify-between">
<span class="font-label-md text-on-surface-variant">Calculated Total</span>
<div class="font-headline-sm text-[16px] text-green-600 flex items-center gap-1 font-bold" id="calcTotalLabel">
                            Total: PKR 0 ✓
                        </div>
</div>
</div>
</div>
<!-- CTA BUTTON -->
<button class="w-full h-[52px] bg-[#FF5722] hover:bg-[#E64A19] active:scale-[0.98] transition-all text-white rounded-xl font-headline-sm text-[18px] font-bold flex items-center justify-center gap-2 shadow-lg shadow-[#FF5722]/30">
                Start Shift
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</main>
</div>
<!-- Background Decoration for Shift Opening context -->
<div class="fixed inset-0 -z-10 bg-[#0A0A0F] opacity-100 flex items-center justify-center pointer-events-none">
<div class="w-full h-full opacity-10" style="background-image: radial-gradient(#FF5722 1px, transparent 1px); background-size: 40px 40px;"></div>
</div>
<script>
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('currentTime').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleDenominations() {
            const container = document.getElementById('denomContainer');
            const chevron = document.getElementById('chevron');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                container.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function setFloat(val) {
            document.getElementById('totalFloat').value = val;
            updateDenominationsFromTotal();
        }

        function calculateTotal() {
            const inputs = document.querySelectorAll('.denom-input');
            let total = 0;
            inputs.forEach(input => {
                const val = parseInt(input.getAttribute('data-val'));
                const qty = parseInt(input.value) || 0;
                total += (val * qty);
            });
            document.getElementById('totalFloat').value = total;
            document.getElementById('calcTotalLabel').innerText = `Total: PKR ${total.toLocaleString()} ✓`;
        }

        function updateDenominationsFromTotal() {
            const total = parseInt(document.getElementById('totalFloat').value) || 0;
            document.getElementById('calcTotalLabel').innerText = `Total: PKR ${total.toLocaleString()} ✓`;
            // If the user manually types the total, we don't necessarily want to force-decompose it 
            // but we update the label for consistency.
        }
    </script>
</body></html>
