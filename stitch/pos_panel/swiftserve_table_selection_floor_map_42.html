<script>
    // State management
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let selectedTable = null;

    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');
    const bottomSheet = document.getElementById('bottomSheet');

    // Pan Logic
    let isDragging = false;
    let startX, startY;

    viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.table-item')) return; // Don't pan if clicking table
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    // Zoom Logic
    function zoom(delta) {
        scale = Math.min(Math.max(0.5, scale + delta), 2);
        updateTransform();
    }

    function resetView() {
        scale = 1;
        panX = 0;
        panY = 0;
        updateTransform();
    }

    function updateTransform() {
        canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    // Selection Logic
    function selectTable(element) {
        if (selectedTable) {
            selectedTable.classList.remove('table-selected');
        }
        
        selectedTable = element;
        selectedTable.classList.add('table-selected');
        
        // Update Bottom Sheet Content
        const id = element.querySelector('.font-bold').innerText;
        document.getElementById('sheetTableId').innerText = id;
        
        // Open Bottom Sheet
        bottomSheet.classList.remove('translate-y-full');
        bottomSheet.classList.add('translate-y-0');
    }

    function closeBottomSheet() {
        if (selectedTable) {
            selectedTable.classList.remove('table-selected');
            selectedTable = null;
        }
        bottomSheet.classList.remove('translate-y-0');
        bottomSheet.classList.add('translate-y-full');
    }

    // Filter Logic
    function filterTables(section, btn) {
        // Update Pills
        document.querySelectorAll('.filter-pill').forEach(p => {
            p.classList.remove('text-primary', 'border-b-2', 'border-primary');
            p.classList.add('text-on-surface-variant');
        });
        btn.classList.add('text-primary', 'border-b-2', 'border-primary');
        btn.classList.remove('text-on-surface-variant');

        // Apply Dimm
        document.querySelectorAll('.table-item').forEach(table => {
            if (section === 'all') {
                table.classList.remove('dimmed');
            } else {
                if (table.getAttribute('data-section') === section) {
                    table.classList.remove('dimmed');
                } else {
                    table.classList.add('dimmed');
                }
            }
        });
    }

    // Initial transform
    updateTransform();
</script>
