<!DOCTYPE html>

<body class="bg-surface font-body-md text-on-surface overflow-hidden">
<!-- Mock Background: Order Screen -->
<div class="fixed inset-0 flex">
<!-- Sidebar Shell (Shared Component Blueprint) -->
<aside class="hidden md:flex flex-col items-center py-md space-y-lg border-r border-outline-variant bg-surface-container-lowest w-[80px] h-full">
<div class="p-xs bg-primary-container rounded-lg">
<span class="material-symbols-outlined text-on-primary-fixed">restaurant</span>
</div>
<nav class="flex flex-col items-center space-y-md w-full">
<div class="text-primary border-r-4 border-primary bg-surface-container-high w-full flex justify-center py-sm transition-transform active:scale-95">
<span class="material-symbols-outlined">restaurant_menu</span>
</div>
<div class="text-on-surface-variant hover:bg-surface-variant w-full flex justify-center py-sm cursor-pointer">
<span class="material-symbols-outlined">table_restaurant</span>
</div>
<div class="text-on-surface-variant hover:bg-surface-variant w-full flex justify-center py-sm cursor-pointer">
<span class="material-symbols-outlined">history</span>
</div>
</nav>
</aside>
<!-- Main Content (Menu Mockup) -->
<main class="flex-1 flex flex-col">
<header class="h-[52px] px-lg flex justify-between items-center bg-surface-dim border-b border-outline-variant">
<h1 class="font-display-lg text-headline-sm text-primary">SwiftServe POS</h1>
<div class="flex items-center space-x-md">
<span class="font-label-lg text-label-lg text-primary">Staff: Alex</span>
</div>
</header>
<div class="p-lg grid grid-cols-4 gap-md opacity-40">
<!-- Mock Menu Items -->
<div class="aspect-square bg-surface-container rounded-xl border border-outline-variant p-md"></div>
<div class="aspect-square bg-surface-container rounded-xl border border-outline-variant p-md"></div>
<div class="aspect-square bg-surface-container rounded-xl border border-outline-variant p-md"></div>
<div class="aspect-square bg-surface-container rounded-xl border border-outline-variant p-md"></div>
</div>
</main>
<!-- Order Tray Mockup -->
<aside class="w-[360px] border-l border-outline-variant bg-surface-container-low hidden lg:flex flex-col p-md">
<h2 class="font-headline-sm text-headline-sm mb-md">Current Order</h2>
<div class="flex-1 space-y-sm">
<div class="p-sm bg-surface-variant rounded-lg border border-outline-variant flex justify-between">
<div>
<div class="font-label-lg text-label-lg">Butter Chicken</div>
<div class="text-xs text-on-surface-variant">Regular Size</div>
</div>
<div class="font-bold">1,150</div>
</div>
</div>
</aside>
</div>
<!-- Backdrop Overlay -->
<div class="fixed inset-0 backdrop-blur-custom z-40 transition-opacity duration-300" id="modal-backdrop"></div>
<!-- Bottom Sheet Container -->
<div class="fixed inset-0 z-50 pointer-events-none flex items-end justify-center px-4 md:px-0">
<div class="pointer-events-auto w-full max-w-[520px] bg-[#111827] rounded-t-[24px] bottom-sheet-shadow flex flex-col max-h-[870px] animate-in slide-in-from-bottom duration-300 ease-out" id="bottom-sheet">
<!-- Drag Handle -->
<div class="flex justify-center py-3">
<div class="w-[36px] h-[4px] bg-white/15 rounded-full"></div>
</div>
<!-- Item Header -->
<div class="px-lg pb-md border-b border-white/[0.06] flex items-center">
<div class="w-[52px] h-[52px] rounded-[10px] overflow-hidden flex-shrink-0 bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A professional high-angle culinary shot of a rich, aromatic Chicken Karahi garnished with fresh ginger slivers and green chilies, served in a traditional black iron wok. The lighting is dramatic and focused, highlighting the glossy texture of the spicy tomato-based gravy. Deep shadows and rich amber tones create a high-contrast, industrial restaurant aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJfEhhZj3Ju-GUAN8Ol8NjjC38OV6P6pGYwb1QTMT1DjzFw4cJTc1gCH5bEWJSeimdX2Irl4VefMCtQlGI1YVKppqOQwUoa0BUtYp9jN1AaM2masSOlGI2zzxR-55rR4K1NxTwkXu7J3JWbTPjV5Gcn6fGflgeCX5pLDNe_g9F44f-sceEKNlNFiGu5ZL0UHFBeK-ESqxjns7l_7X1gxtppifTQisnOlITFYSJA_orgDKPx0Bg8avJ4e2xfZCI0Gz9tvEelzVxn-2M"/>
</div>
<div class="ml-md flex-1">
<h3 class="font-headline-sm text-headline-sm text-white leading-tight">Chicken Karahi</h3>
<p class="text-[13px] font-medium text-[#64748B]">PKR 1,200</p>
</div>
<button class="w-[32px] h-[32px] rounded-full bg-[#1E293B] flex items-center justify-center text-[#94A3B8] hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto p-lg space-y-8">
<!-- SIZE SECTION (Required) -->
<section>
<div class="flex justify-between items-center mb-md">
<label class="text-[11px] font-bold tracking-wider text-[#64748B] uppercase">CHOOSE SIZE *</label>
<span class="text-[11px] font-bold text-[#F59E0B] px-2 py-0.5 rounded bg-[#F59E0B]/10">REQUIRED</span>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Unselected -->
<div class="cursor-pointer bg-[#1E293B] border-[1.5px] border-white/5 rounded-[10px] p-md flex flex-col hover:border-white/20 transition-all active:scale-[0.98]">
<span class="text-white font-semibold text-body-md">Regular</span>
<span class="text-[#64748B] text-sm">PKR 1,200</span>
</div>
<!-- Selected -->
<div class="cursor-pointer bg-[#F59E0B]/10 border-2 border-[#F59E0B] rounded-[10px] p-md flex flex-col relative transition-all active:scale-[0.98]">
<span class="text-[#F59E0B] font-bold text-body-md">Full</span>
<span class="text-[#F59E0B]/80 text-sm font-medium">PKR 2,100</span>
<div class="absolute top-2 right-2">
<span class="material-symbols-outlined text-[#F59E0B] text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</section>
<!-- EXTRAS SECTION (Optional) -->
<section>
<div class="mb-md">
<label class="text-[11px] font-bold tracking-wider text-[#64748B] uppercase">ADD EXTRAS</label>
<p class="text-[11px] text-[#64748B] mt-0.5">Optional • Select up to 3</p>
</div>
<div class="space-y-sm">
<!-- Extra Raita -->
<label class="flex items-center justify-between p-md bg-[#1E293B]/40 rounded-xl cursor-pointer group hover:bg-[#1E293B] transition-colors">
<span class="text-on-surface-variant font-medium">Extra Raita <span class="text-[#64748B] font-normal ml-1">(+PKR 80)</span></span>
<input class="custom-checkbox w-5 h-5 rounded-full border-white/20 bg-transparent focus:ring-0 focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
<!-- Fresh Salad -->
<label class="flex items-center justify-between p-md bg-[#1E293B]/40 rounded-xl cursor-pointer group hover:bg-[#1E293B] transition-colors">
<span class="text-on-surface-variant font-medium">Fresh Salad <span class="text-[#64748B] font-normal ml-1">(+PKR 120)</span></span>
<input checked="" class="custom-checkbox w-5 h-5 rounded-full border-white/20 bg-transparent focus:ring-0 focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
<!-- Extra Naan -->
<label class="flex items-center justify-between p-md bg-[#1E293B]/40 rounded-xl cursor-pointer group hover:bg-[#1E293B] transition-colors">
<span class="text-on-surface-variant font-medium">Extra Naan <span class="text-[#64748B] font-normal ml-1">(+PKR 40)</span></span>
<input class="custom-checkbox w-5 h-5 rounded-full border-white/20 bg-transparent focus:ring-0 focus:ring-offset-0 transition-all cursor-pointer" type="checkbox"/>
</label>
</div>
</section>
<!-- SPECIAL NOTE SECTION -->
<section>
<label class="block text-[11px] font-bold tracking-wider text-[#64748B] uppercase mb-md">SPECIAL NOTE</label>
<div class="relative">
<input class="w-full h-11 px-4 bg-[#1E293B] border-none rounded-lg text-white placeholder-[#64748B] focus:ring-2 focus:ring-[#F59E0B] focus:outline-none transition-all" placeholder="No onions, extra spicy..." type="text"/>
</div>
</section>
<!-- QUANTITY SELECTOR -->
<section class="flex items-center justify-between py-xs border-t border-white/[0.06]">
<span class="font-bold text-white">Quantity</span>
<div class="flex items-center space-x-6">
<button class="w-[40px] h-[40px] rounded-full bg-[#1E293B] flex items-center justify-center text-white active:scale-90 transition-transform">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="text-[22px] font-bold text-white w-6 text-center">1</span>
<button class="w-[40px] h-[40px] rounded-full bg-[#1E293B] flex items-center justify-center text-white active:scale-90 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</section>
</div>
<!-- Sticky Footer -->
<div class="p-lg bg-[#111827] border-t border-white/[0.06]">
<button class="w-full h-[54px] bg-[#F59E0B] hover:bg-[#D97706] rounded-xl flex items-center justify-between px-lg text-on-primary active:scale-95 transition-all duration-150">
<span class="font-bold text-body-lg">Add to Order</span>
<span class="font-currency-display text-[20px]">PKR 1,280</span>
</button>
</div>
</div>
</div>
<!-- Micro-interactions Script -->
<script>
        // Simple scale effect for interactive tiles and list items
        document.querySelectorAll('.active-scale').forEach(item => {
            item.addEventListener('mousedown', () => {
                item.style.transform = 'scale(0.98)';
            });
            item.addEventListener('mouseup', () => {
                item.style.transform = 'scale(1)';
            });
            item.addEventListener('mouseleave', () => {
                item.style.transform = 'scale(1)';
            });
        });

        // Close logic mock
        document.querySelector('button .material-symbols-outlined[innerText="close"]')?.parentElement.addEventListener('click', () => {
            document.getElementById('bottom-sheet').classList.add('translate-y-full', 'opacity-0');
            document.getElementById('modal-backdrop').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('bottom-sheet').parentElement.style.display = 'none';
                document.getElementById('modal-backdrop').style.display = 'none';
            }, 300);
        });
    </script>
</body></html>
