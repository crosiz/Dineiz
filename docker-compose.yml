services:
  # ── Infrastructure ──

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: dineiz_db
    restart: always
    environment:
      POSTGRES_USER: dineiz
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dineiz
    ports:
      - "5434:5432"
    volumes:
      - dineiz_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dineiz" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: dineiz_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - dineiz_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: dineiz_meili
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKeyForDevelopmentOnly123}
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - dineiz_meili_data:/meili_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  forecast:
    build:
      context: ./apps/forecast
    container_name: dineiz_forecast
    restart: always
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  pdf-worker:
    build:
      context: ./apps/pdf-worker
    container_name: dineiz_pdf_worker
    restart: always
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8091/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  aggregator-bridge:
    build:
      context: ./apps/aggregator-bridge
    container_name: dineiz_aggregator_bridge
    restart: always
    ports:
      - "8092:8092"
    environment:
      - PORT=8092
      - API_URL=http://api:8080
      - BRIDGE_SECRET=${BRIDGE_SECRET:-dev-bridge-secret}
#    depends_on:
#      api:
#        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8092/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Database Initialization ──

  prisma-migrate:
    image: node:22-alpine
    container_name: dineiz_prisma_migrate
    working_dir: /app
    env_file: .env.development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "apk add --no-cache openssl && npm install -g pnpm && pnpm config set store-dir /pnpm-store && pnpm install --no-frozen-lockfile && pnpm --filter @dineiz/db exec prisma migrate dev --name init"
    profiles: [ "migrate" ] # Only runs when explicitly targeted or using the make command
  # ── Applications (Local Development) ──

